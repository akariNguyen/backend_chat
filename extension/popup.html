<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Brand Search Worker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Brand Search Worker</h1>
    <label class="switch"><input id="enabled" type="checkbox"> <span id="enabled-text">Bật</span></label>
  </header>

  <dl>
    <dt>Worker ID</dt><dd id="worker-id">…</dd>
    <dt>Backend</dt><dd id="backend">…</dd>
    <dt>Trạng thái</dt><dd id="state">…</dd>
  </dl>
  <p id="backend-error" class="error" hidden></p>

  <button id="lookup" type="button">Tra brand trang này</button>
  <p class="links"><a id="open" href="#">Mở trang tra cứu</a></p>

  <details id="connection">
    <summary>Kết nối backend</summary>
    <form id="connection-form">
      <label>URL backend <input id="backend-url" type="text" placeholder="http://127.0.0.1:8765 hoặc http://IP-VPS:8765" spellcheck="false"></label>
      <label>API key <input id="api-key" type="password" placeholder="BRAND_API_KEY trong backend\.env (để trống nếu không đặt)" autocomplete="off"></label>
      <button type="submit">Lưu &amp; kiểm tra</button>
      <p id="connection-result" class="muted"></p>
    </form>
  </details>

  <h2>Nhật ký</h2>
  <ol id="log" class="log"></ol>
  <script src="popup.js"></script>
</body>
</html>
